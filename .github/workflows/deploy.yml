name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, not a bare "pages". Every pull request runs this workflow, so
  # a single shared group means an opening pull request cancels whatever is
  # running — including a deploy of main that is halfway through publishing.
  # Pushes to main still share one group and still serialise, which is what
  # Pages wants; a Monday morning's Dependabot pull requests no longer cancel
  # each other, or the live site going out.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in step with the Dockerfile's base image. Dependabot bumps
          # that but not this: here the version is an action input, not a
          # dependency, so nothing watches it.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Build site
        run: npm run build
      - name: Check built output
        run: npm run check:output
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy only runs on pushes to main, not on pull requests.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
